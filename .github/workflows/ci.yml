name: CI

on:
  pull_request:
    branches: ["main", "develop"]

# Every job only reads the repository.
permissions:
  contents: read

env:
  # Freezes datacontract-cli's transitive dependencies to what existed on this
  # date, so a later upload cannot change what CI runs.
  UV_EXCLUDE_NEWER: "2026-11-01T00:00:00Z"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  migrations:
    name: Atlas migration checksums
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate atlas.sum
        run: docker run --rm -v "$PWD/database/migrations:/migrations" arigaio/atlas:1.3.6 migrate validate --dir file:///migrations

  odcs-lint:
    name: ODCS contract lint
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The job runs a downloaded CLI; it gets no token to push with.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        # dev extras: the ODPS check below validates with jsonschema.
        run: uv sync --extra dev

      - name: Generate contracts with the real serializer
        run: |
          mkdir -p odcs-lint
          uv run python -m tests.fixtures.odcs.sample_contract odcs-lint/sample.yaml
          uv run python -m tests.fixtures.odcs.sample_contract odcs-lint/full.yaml full

      - name: Lint the contracts
        run: |
          status=0
          for file in odcs-lint/*.yaml; do
            report="${file%.yaml}.lint.json"
            uvx --from datacontract-cli==1.2.9 datacontract lint "$file" \
              --output "$report" --output-format json || true
            result="$(jq -r '.result // "missing"' "$report" 2>/dev/null || echo missing)"
            echo "$file: datacontract lint result is '$result'"
            if [ "$result" != "passed" ]; then
              echo "::error file=$file::datacontract lint result is '$result', expected 'passed'"
              status=1
            fi
          done
          exit "$status"

      # There is no ODPS CLI: the export of products built by the real code is
      # validated against the vendored ODPS v1.1.0 JSON Schema and its prose rules.
      - name: Validate the ODPS product export
        run: |
          mkdir -p odps-lint
          uv run python -m tests.fixtures.odps.sample_product odps-lint/sample.yaml
          uv run python -m tests.fixtures.odps.sample_product odps-lint/full.yaml full
          uv run python -m tests.fixtures.odps.validator odps-lint/sample.yaml odps-lint/full.yaml

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    # A throwaway database for the data migration tests; other jobs skip them.
    services:
      postgres:
        image: postgres:16.1
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest tests/ -v --tb=short
