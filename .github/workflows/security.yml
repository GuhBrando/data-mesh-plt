name: Security

on:
  pull_request:
    branches: ["main", "develop"]
  schedule:
    - cron: "0 8 * * 1"

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      # Same version as the pre-commit hook. The gitleaks CLI is free (MIT); only
      # gitleaks-action needs a paid license once the repository belongs to an
      # organization.
      GITLEAKS_VERSION: "8.27.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            | grep " ${tarball}\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      # Pull requests: only the commits the PR adds. Schedule: the whole history.
      # .gitleaks.toml and .gitleaksignore at the repository root apply.
      - name: Scan for secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            ./gitleaks git --redact --verbose --exit-code 1 \
              --log-opts="--no-merges --first-parent ${BASE_SHA}..${HEAD_SHA}" .
          else
            ./gitleaks git --redact --verbose --exit-code 1 .
          fi

  security-lint-python:
    name: Python Security Lint (bandit)
    runs-on: ubuntu-latest
    needs: secret-scan
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - run: uv sync --extra dev

      - name: Run bandit (medium+ severity blocks merge)
        run: uv run bandit -r backend/ -ll -c pyproject.toml

  security-lint-react:
    name: React Security Lint (eslint-plugin-security)
    runs-on: ubuntu-latest
    needs: secret-scan
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: ESLint security rules
        run: npm run lint
        working-directory: frontend

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    needs: secret-scan
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - run: uv sync --extra dev

      - name: Python dependency audit (all known CVEs)
        run: uv run pip-audit --ignore-vuln CVE-2026-3219

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Node dependency audit (high/critical only)
        run: npm audit --audit-level=high
        working-directory: frontend
